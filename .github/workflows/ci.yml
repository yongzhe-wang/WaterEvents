# CI — the thing that was missing while every one of these classes of bug shipped.
#
# 用一句话讲完: 五项检查,全部是「机器能抓、人反复漏」的那一类 —— 语法、凭据、部署脚本、跨文件命名一致性。
# 这不是代码质量门禁,是**事故复现门禁**:下面每一条都对应一个真实发生过并且花了人力才发现的问题。
#
# WHY this exists, concretely. In a single day this repo shipped: two Python files with unclosed docstrings that made
# the whole backend unimportable; a bash script broken by an apostrophe inside ${VAR:?...}, which also broke the systemd
# installer that evals that file; a production database password left in eight tracked files; and a watchdog that named
# a systemd target no installer created, so its failure mode was reporting success every five minutes while guarding
# nothing. Each was found by a person reading code, hours later, one at a time. Every one of them is caught by a check
# below in under a minute.
#
# The checks are deliberately cheap and dependency-free — no linter config to argue about, no formatter, no coverage
# gate. A CI that is red on day one gets ignored, so this starts green: all five were verified against the tree before
# it was committed.

name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1 — every tracked Python file must at least PARSE. Not linting, not typing: parsing. This is the check that
      # catches a docstring left unclosed by an edit, which is how backend/agent/event_agent/crawl/extract.py and
      # backend/providers/watercrawl/runtime.py both became unimportable on 2026-07-28. Both files sit on the fleet's
      # import path, so the next worker restart would have been a crash loop under Restart=always.
      - name: python parses
        run: |
          fail=0
          for f in $(git ls-files '*.py'); do
            python -m py_compile "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done
          exit $fail

      # 1b — every FIRST-PARTY import must resolve to a file that actually exists. Parsing is not enough: on 2026-07-28
      # backend/providers/watercrawl/render.py carried `from . import politeness` while politeness.py did not exist in
      # the tree at all. That file parses perfectly — check 1 is GREEN on it — and the failure surfaces only when
      # something imports the module, i.e. when a worker starts. The entire crawl path was unimportable and no syntax
      # check could have said so. This closes that exact gap, and does it STATICALLY, so it needs none of the heavy
      # third-party deps (playwright, torch, asyncpg) that a real `import` would drag onto the runner.
      # {INCIDENT 2026-07-28 "RENDER.PY:23 `from . import politeness` — POLITENESS.PY DID NOT EXIST; ast.parse PASSED
      #  WHILE importlib RAISED ModuleNotFoundError, SO THE WHOLE WATERCRAWL CHAIN WAS DEAD"}
      # [CONFIDENCE: CONFIRMED 100% — reproduced both halves: the file parsed clean, importing it raised.]
      - name: first-party imports resolve
        run: |
          python - <<'PY'
          import ast, os, re, subprocess, sys
          ROOTS = ("agent", "providers", "tools", "api_service")   # top-level packages that live under backend/
          missing = []

          def is_module(path):                                     # a module is either x.py or a package dir x/__init__.py
              return os.path.exists(path + ".py") or os.path.exists(os.path.join(path, "__init__.py"))

          def reexported(pkg_dir, name):
              """Is `name` plausibly a symbol re-exported by pkg_dir/__init__.py rather than a submodule? A static check
              cannot resolve symbols, so this is the deliberate false-positive escape valve: if __init__.py mentions the
              name at all, we stay quiet. It must be checked ONLY after the submodule possibilities are exhausted —
              an earlier version treated "the package exists" as sufficient, which made the whole check vacuously
              green (it passed even with politeness.py deleted). Verified by deleting that file and re-running."""
              init = os.path.join(pkg_dir, "__init__.py")
              if not os.path.exists(init):
                  return False
              return re.search(r"\b%s\b" % re.escape(name), open(init, encoding="utf8").read()) is not None

          for f in subprocess.run(["git", "ls-files", "*.py"], capture_output=True, text=True).stdout.split():
              try:
                  tree = ast.parse(open(f, encoding="utf8").read())
              except SyntaxError:
                  continue                                          # check 1 owns syntax — don't double-report it here
              pkg = os.path.dirname(f)
              for n in ast.walk(tree):
                  if isinstance(n, ast.ImportFrom) and n.level:     # relative: `from . import x` / `from .y import z`
                      base = pkg
                      for _ in range(n.level - 1):
                          base = os.path.dirname(base)
                      sub = os.path.join(base, (n.module or "").replace(".", "/"))
                      if n.module and not is_module(sub):           # the module part itself is missing → unambiguous
                          missing.append(f"{f}:{n.lineno}  from {'.' * n.level}{n.module}")
                          continue
                      if n.module and os.path.exists(sub + ".py"):  # importing FROM a plain module → names are symbols
                          continue
                      for a in n.names:                             # `sub` is a package dir here
                          if is_module(os.path.join(sub, a.name)):
                              continue
                          if reexported(sub, a.name):
                              continue
                          missing.append(f"{f}:{n.lineno}  from {'.' * n.level}{n.module or ''} import {a.name}")
                      continue
                  mods = []
                  if isinstance(n, ast.ImportFrom) and n.module:    # absolute: `from agent.x.y import z`
                      mods = [n.module]
                  elif isinstance(n, ast.Import):
                      mods = [a.name for a in n.names]
                  for m in mods:
                      if m.split(".")[0] not in ROOTS:              # third-party / stdlib is not this check's business
                          continue
                      if not is_module(os.path.join("backend", *m.split("."))):
                          missing.append(f"{f}:{n.lineno}  {m}")
          for m in sorted(set(missing)):
              print(f"::error::unresolvable first-party import — {m}")
          print("all first-party imports resolve" if not missing else f"{len(set(missing))} unresolvable import(s)")
          sys.exit(1 if missing else 0)
          PY

      # 1c — a module-level definition that NOTHING calls fails the build. ruff's F821 already covers the mirror case
      # (used but never defined); this is the direction that actually keeps happening here. On 2026-07-28 five separate
      # freshly-written fixes — an SSRF/robots guard, a teardown timeout, a semaphore warning, the queue lease reaper
      # and a date-bucketing key fix — were all believed shipped while every one had zero call sites. A fix that is
      # never called is worse than no fix: it closes the ticket without changing the behaviour.
      # Blocking, with a name-keyed baseline for the backlog that existed when it landed, so anything NEW fails at once
      # while the known list can only shrink (a baseline entry that gains a caller also fails).
      - name: no unused definitions
        run: python backend/scripts/ops/check_unused.py

      # 2 — every tracked shell script must parse. `bash -n` would have caught the apostrophe in
      # ${QWEN_API_KEY:?... the pod's vLLM ...} that made launch_fleet.sh unrunnable — and that mattered beyond the one
      # script, because install_systemd.sh evals its `export` lines to build the systemd EnvironmentFile.
      - name: shell parses
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done
          exit $fail

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3 — the serverless handlers and the self-host server must parse. These are deployed by file copy with no build
      # step, so a syntax error reaches production directly.
      - name: javascript parses
        run: |
          fail=0
          for f in $(git ls-files 'frontend/*.mjs' 'frontend/api/*.js' 'frontend/lib/*.js'); do
            node --check "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done
          exit $fail

      # 4 — no live credential may enter a tracked file. The patterns are the three that were actually committed here:
      # the Supabase password, the vLLM api-key and the Webshare proxy password. *.example is exempt because that file
      # carries deliberate placeholders.
      # This is the highest-value check in the file. The database password reached eight tracked files and three
      # commits, starting with the repo's very first one — and no edit can undo that, only rotation can. The point of
      # this check is that the NEXT one never gets that far.
      # The proxy password is written :36oo15uctfh[l]@ rather than plainly: the other two patterns contain regex
      # metacharacters and so cannot match themselves, but a bare literal would — this file would flag ITSELF and CI
      # would be red from the first run for no real reason. The character class matches the real credential while the
      # text stored here is not that credential.
      - name: no committed credentials
        run: |
          hits=$(git ls-files -z \
            | xargs -0 grep -lE 'FocusAlpha20[0-9]{2}|sk-waterevents-[a-f0-9]{16,}|:36oo15uctfh[l]@' 2>/dev/null \
            | grep -v '\.example$' || true)
          if [ -n "$hits" ]; then
            echo "::error::live credential found in tracked files:"
            echo "$hits" | sed 's/^/  /'
            exit 1
          fi
          echo "no credentials in tracked files"

      # 5 — WARNING ONLY. Two installers in this repo disagree on the fleet target name, and a watchdog that hardcodes
      # the wrong one stands down silently forever. watchdog.sh now resolves the name at runtime so the disagreement is
      # survivable, which is why this reports rather than fails; it exists so the divergence stays visible instead of
      # being rediscovered by an outage.
      - name: one fleet target name (warning)
        run: |
          names=$(git ls-files 'backend/deploy/*' | xargs grep -ohE 'waterevents(-fleet)?\.target' 2>/dev/null | sort -u)
          count=$(echo "$names" | grep -c . || true)
          echo "fleet target names referenced: $(echo $names | tr '\n' ' ')"
          [ "$count" -le 1 ] || echo "::warning::$count different fleet target names are referenced; a hardcoded watchdog would silently stand down"
