[Service]
# TENANT IDENTITY for the fair_gateway — NOT the vLLM credential. The gateway accounts the weighted share against
# whatever key arrives, then swaps it for the real one before forwarding upstream, so the two fleets MUST present
# different values or the share collapses into a single bucket and the isolation silently does nothing.
#
# A SECOND EnvironmentFile, not Environment=. This is the whole trick and it cost a wrong attempt to find:
# EnvironmentFile= is applied AFTER Environment=, so a plain `Environment=QWEN_API_KEY=event_agent` in a drop-in is
# computed correctly by systemd and then overwritten by fleet.env's own QWEN_API_KEY before exec. The evidence was a
# unit whose computed property said one thing and whose process environment said another:
#   {SYSTEMCTL SHOW waterevents-worker@1 -p Environment → "QWEN_API_KEY=event_agent"}
#   {/proc/<pid>/environ                                 → "QWEN_API_KEY=sk-waterevents-…"}
# Drop-ins are merged after the main unit, so a drop-in EnvironmentFile is read after fleet.env and wins on the same
# terms rather than on a precedence rule that runs the other way.
# [CONFIDENCE: CONFIRMED — both readings taken from the same live unit, after a clean daemon-reload and restart].
#
# It is per-unit rather than in fleet.env because both fleets read the same fleet.env; the identity is the one thing
# that has to differ between them.
EnvironmentFile=/etc/waterevents/tenant-event.env
