# Rotate the six worker logs. Landed from the host 2026-07-29; systemd/install.sh has referenced this path since it was
# written, but the file was never committed, so `install -m 644 <missing>` aborted that installer under `set -e`.
#
# 用一句话讲完: 6 个 worker 各自 append 到 ~/eventinc_fleet/wN.log, 每天或超过 100M 就轮转, 保留 7 份并压缩 ——
# 不轮转的话它们单调增长直到把盘写满, 而这些正是唯一记录 ⛔ EXTRACT FAILED 的地方。
#
# copytruncate IS LOAD-BEARING, not a default. launch_fleet.sh starts each worker with `>>` and systemd's
# StandardOutput=append: — the process holds the file open for the whole run. Plain rotation renames the inode, and the
# worker keeps writing to the renamed file forever, so the "current" log stays empty and the rotated one grows without
# bound: rotation that silently stops working. copytruncate copies then truncates in place, so the open descriptor keeps
# writing to the same inode.
# {WORKER@.SERVICE "STANDARDOUTPUT=APPEND:/HOME/THEBIGSUN/EVENTINC_FLEET/W%I.LOG"}
# [CONFIDENCE: CONFIRMED 95% — the append-mode descriptor is read off the unit file; that plain rotation strands such a
#  writer is standard logrotate behaviour, which is exactly what copytruncate exists for.]
#
# notifempty + missingok so a host with fewer than six workers, or one that has not started yet, does not log an error
# every day for a file that legitimately does not exist.
/home/thebigsun/eventinc_fleet/*.log {
    daily
    rotate 7
    size 100M
    compress
    missingok
    notifempty
    copytruncate
}
